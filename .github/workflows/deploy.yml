name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # pnpm ignores env-var credentials in a committed project .npmrc, so the Font Awesome
      # token has to come from the runner's user-level config instead.
      - run: pnpm config set "//npm.fontawesome.com/:_authToken" "$VITE_FA_AUTH_TOKEN"
        env:
          VITE_FA_AUTH_TOKEN: ${{ secrets.VITE_FA_AUTH_TOKEN }}

      # The env var must also be present here or pnpm drops the whole project .npmrc,
      # including the @fortawesome scoped-registry line.
      - run: pnpm install --frozen-lockfile
        env:
          VITE_FA_AUTH_TOKEN: ${{ secrets.VITE_FA_AUTH_TOKEN }}

      - run: pnpm build
        env:
          VITE_CYCLOMEDIA_USERNAME: ${{ secrets.VITE_CYCLOMEDIA_USERNAME }}
          VITE_CYCLOMEDIA_PASSWORD: ${{ secrets.VITE_CYCLOMEDIA_PASSWORD }}
          VITE_CYCLOMEDIA_API_KEY: ${{ secrets.VITE_CYCLOMEDIA_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
